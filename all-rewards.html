<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ของรางวัลทั้งหมด – Royal Point</title>
  <style>#systemBootOverlay{box-sizing:border-box}</style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
  <style id="systemBootCriticalStyles">#systemBootOverlay{position:fixed;inset:0;z-index:12000;display:flex;align-items:center;justify-content:center;padding:20px;background:#f0fdfa;color:#0f172a;font-family:system-ui,sans-serif}#systemBootOverlay .system-boot-card{box-sizing:border-box;width:min(100%,420px);padding:28px 24px;text-align:center;background:#fff;border:1px solid #dbeafe;border-radius:24px;box-shadow:0 24px 60px rgba(15,23,42,.12)}#systemBootOverlay .system-boot-spinner{width:52px;height:52px;margin:0 auto 18px;border:5px solid #dbeafe;border-top-color:#10b981;border-radius:50%;animation:systemBootSpin .85s linear infinite}#systemBootOverlay .system-boot-title{font-size:1.18rem;font-weight:800;margin:0 0 6px}#systemBootOverlay .system-boot-message{min-height:48px;margin:0;color:#475569;line-height:1.55}#systemBootOverlay .system-boot-track{height:6px;margin-top:18px;border-radius:999px;background:#d1fae5;overflow:hidden}#systemBootOverlay .system-boot-bar{width:42%;height:100%;background:#10b981;animation:systemBootProgress 1.35s ease-in-out infinite}#systemBootOverlay .system-boot-hint{display:block;margin-top:12px;color:#64748b;font-size:.78rem}#systemBootOverlay .system-boot-retry{display:none}@keyframes systemBootSpin{to{transform:rotate(360deg)}}@keyframes systemBootProgress{from{transform:translateX(-110%)}to{transform:translateX(240%)}}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="/style.css?v=mobile-status" rel="stylesheet">
  <link href="/ui-status.css?v=1" rel="stylesheet">

  <style>
    body { background:#f8fafc; font-family: 'Kanit', sans-serif; }
    
    .reward-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      padding: 8px;
    }

    .reward-card {
      position: relative;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      overflow: hidden;
      transition: transform 0.2s;
    }
    .reward-card:active { transform: scale(0.98); }

    .reward-card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #fff;
      padding: 8px;
    }

    .reward-name {
      font-weight: 600;
      font-size: 0.95rem;
      padding: 6px 10px 0;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reward-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px; padding: 0 10px; }
    .reward-cost { font-weight: 700; font-size: .8125rem; color: #14532d; }
    .reward-stock { font-size: .8125rem; color: #475569; }

    .reward-footer { padding: 6px 10px 10px; }
    .reward-footer button { min-height: 44px; touch-action: manipulation; }

    .reward-card.soldout img { filter: grayscale(1); }
    
    /* Skeleton Animation */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* เพิ่มต่อท้ายใน <style> */
    .reward-filters .btn { min-height: 44px; }
    .reward-shortage:disabled {
      opacity: 1;
      color: #854d0e;
      background: #fef9c3;
      border-color: #fde68a;
    }
  </style>
</head>

<body>

<div id="systemBootOverlay" role="status" aria-live="polite" aria-busy="true"><div class="system-boot-card"><div class="system-boot-spinner" aria-hidden="true"></div><h2 class="system-boot-title">กำลังเปิดหน้าของรางวัล</h2><p class="system-boot-message">กำลังโหลดคะแนนและรายการของรางวัล กรุณารอสักครู่</p><div class="system-boot-track" aria-hidden="true"><div class="system-boot-bar"></div></div><small class="system-boot-hint">กรุณาอย่าปิดหน้าต่างระหว่างกำลังโหลด</small><button type="button" class="system-boot-retry">โหลดระบบใหม่</button></div></div>

<div id="topProgress" style="position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;display:none;">
  <div id="topProgressBar" style="height:100%;background:#10b981;width:100%;transform-origin:0 50%;transform:scaleX(0);"></div>
</div>

<div id="appOverlay" class="loading-overlay">
  <div class="box">
    <div class="spinner-border text-primary" role="status" style="width: 1.5rem; height: 1.5rem;"></div>
    <span id="overlayMsg">กำลังดำเนินการ...</span>
  </div>
</div>

<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">

  </div>

  <div id="skeletonGrid" class="reward-grid">
    <script>
      for(let i=0; i<8; i++) {
        document.write(`
          <div class="reward-card p-2" style="height:240px">
            <div class="skeleton w-100 h-50 mb-2"></div>
            <div class="skeleton w-75 h-25 mx-auto mb-2"></div>
            <div class="skeleton w-100 h-25"></div>
          </div>
        `);
      }
    </script>
  </div>

  <div id="rewardGrid" class="reward-grid d-none"></div>

</div>

<div class="modal fade" id="rewardPreviewModal" tabindex="-1" aria-hidden="true">

    <div class="modal-content border-0 rounded-4 overflow-hidden">
      <button type="button" class="btn-close position-absolute end-0 m-3 bg-white rounded-circle p-2" data-bs-dismiss="modal" aria-label="Close" style="z-index:2;"></button>
      <img id="rewardPreviewImg" class="w-100 bg-light" src="" alt="Reward preview" style="aspect-ratio:4/3; object-fit:contain;">
      <div class="p-3">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <div style="min-width:0;">
            <h5 id="rewardPreviewName" class="fw-bold mb-1 text-truncate">ของรางวัล</h5>
            <div id="rewardPreviewStock" class="small text-muted"></div>

        </div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="loader.js?v=line-token-v1-public-catalog"></script>
<script src="/ui-status.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 

<script>

// 1. ดึง UID
const getUid = () => {
  const params = new URLSearchParams(window.location.search);
  return String(params.get('uid') || sessionStorage.getItem('uid') || localStorage.getItem('uid') || '').trim();
};
const LIFF_ID_REWARDS = "2007053300-QoEvbXyn";

// ตัวแปรเก็บคะแนนปัจจุบัน
let CURRENT_SCORE = 0;
let REWARDS_SCORE_READY = false;
let REWARD_LIST = [];
let INITIAL_REWARDS_LOADING = true;
let rewardsLoadPromise = null;
let REDEEMING = false;
let rewardFilter = new URLSearchParams(location.search).get('filter') === 'affordable' ? 'affordable' : 'all';
let rewardsCatalogReady = false;
const formatRewardPoints = new Intl.NumberFormat('th-TH');

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  }[ch]));
}

function safeImageUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return 'https://placehold.co/300x300?text=No+Image';
  try {
    const url = new URL(raw);
    if (url.protocol === 'https:' && !url.username && !url.password) return url.href;
  } catch {}
  return 'https://placehold.co/300x300?text=No+Image';
}

function bindRewardImageFallbacks(root = document) {
  root.querySelectorAll('img[data-reward-image]').forEach(image => {
    image.addEventListener('error', () => {
      image.src = 'https://placehold.co/300x300?text=No+Image';
    }, { once: true });
  });
}

async function resolveUid() {
  await (window.RoyalAuth?.ready || Promise.resolve());

  // โหมดช่วยเหลือเป็นกรณีเดียวที่อนุญาตให้ใช้ UID เดิมโดยไม่ส่ง LINE token
  if (window.RoyalAuth?.isRecoveryMode?.()) {
    const recoveryUid = getUid();
    if (!recoveryUid) throw new Error('recovery_uid_not_found');
    window.__UID = recoveryUid;
    return { uid: recoveryUid, redirecting: false, recovery: true };
  }

  // UID ใน URL/storage เป็นเพียงข้อมูลอ้างอิง ห้ามใช้แทนการยืนยันตัวตน LINE
  if (!window.liff) throw new Error('liff_sdk_not_ready');
  await liff.init({ liffId: LIFF_ID_REWARDS });
  if (!liff.isLoggedIn()) {
    window.SystemBoot?.update?.('กำลังเปิด LINE เพื่อยืนยันตัวตน');
    liff.login({ redirectUri: window.location.href });
    return { uid: '', redirecting: true, recovery: false };
  }

  const profile = await liff.getProfile();
  const uid = String(profile?.userId || '').trim();
  if (!uid) throw new Error('line_uid_not_found');

  sessionStorage.setItem('uid', uid);
  window.__UID = uid;

  // รองรับลิงก์เก่าที่มี UID แต่ลบข้อมูลส่วนบุคคลออกจาก URL หลังยืนยันสำเร็จ
  const cleanUrl = new URL(window.location.href);
  if (cleanUrl.searchParams.has('uid')) {
    cleanUrl.searchParams.delete('uid');
    window.history.replaceState({}, '', cleanUrl.toString());
  }

  return { uid, redirecting: false, recovery: false };
}

/* ===============================
   LOAD DATA (Rewards + Score)
================================ */
function loadAllRewards() {
  if (!rewardsLoadPromise) rewardsLoadPromise = refreshRewardsPage().finally(() => { rewardsLoadPromise = null; });
  return rewardsLoadPromise;
}

async function refreshRewardsPage() {
  const initialPageLoad = INITIAL_REWARDS_LOADING;
  const grid = document.getElementById('rewardGrid');
  const skel = document.getElementById('skeletonGrid');
  const status = document.getElementById('rewardsLoadStatus');
  const retry = document.getElementById('retryRewardsLoad');
  let auth;

  try {
    auth = await resolveUid();
  } catch (err) {
    console.error(err);
    REWARDS_SCORE_READY = false;
    skel.classList.add('d-none');
    grid.classList.add('d-none');
    status.textContent = 'ยืนยันตัวตน LINE ไม่สำเร็จ กรุณาลองใหม่';
    retry.classList.remove('d-none');
    window.SystemBoot?.hide?.();
    return;
  }
  if (auth.redirecting) return;

  if (initialPageLoad) {
    INITIAL_REWARDS_LOADING = false;
    window.SystemBoot?.hide?.();
  }
  REWARDS_SCORE_READY = false;
  if (rewardsCatalogReady) renderGrid();
  status.textContent = 'กำลังตรวจคะแนนเพื่อแลกรางวัล';
  retry.classList.add('d-none');
  const uid = auth.uid;
  const loadScore = Loading.apiFetch(`/api/get-score?uid=${encodeURIComponent(uid)}&includeRewards=0`, { cache:'no-store' })
    .then(result => {
      const data = result?.data;
      const score = Number(data?.score ?? data?.points ?? data?.point ?? data?.balance ?? NaN);
      if (!Number.isFinite(score)) throw new Error('score_missing');
      CURRENT_SCORE = score;
      REWARDS_SCORE_READY = true;
      try { localStorage.setItem(`RP_SCORE:${uid}`, score); } catch {}
      if (rewardsCatalogReady) renderGrid();
      return true;
    }).catch(() => {
      if (rewardsCatalogReady) renderGrid();
      return false;
    });

  const loadCatalog = Loading.apiFetch('/api/rewards?include=0', { cache:'no-store' }).then(result => {
    const list = (result.items || result.data || []).map(item => ({
      id: item.id,
      name: String(item.name || ''),
      cost: Number(item.cost || 0),
      img: safeImageUrl(item.img),
      stock: Number(item.stock ?? 0),
      stock_max: Number(item.stock_max ?? 0),
      sort_index: Number(item.sort_index ?? 999)
    }));
    list.sort((a, b) => Number(a.stock <= 0) - Number(b.stock <= 0) || a.sort_index - b.sort_index);
    REWARD_LIST = list;
    rewardsCatalogReady = true;
    document.getElementById('rewardControls').classList.remove('d-none');
    renderGrid();
    grid.classList.remove('d-none');
    return true;
  }).catch(() => false).finally(() => skel.classList.add('d-none'));

  const [scoreLoaded, catalogLoaded] = await Promise.all([loadScore, loadCatalog]);
  status.textContent = !catalogLoaded ? 'โหลดรายการรางวัลไม่สำเร็จ' : !scoreLoaded ? 'ตรวจคะแนนไม่สำเร็จ กรุณาลองโหลดใหม่ก่อนแลกรางวัล' : '';
  retry.classList.toggle('d-none', scoreLoaded && catalogLoaded);
}

/* ===============================
   RENDER GRID
================================ */
const rewardControls = document.getElementById('rewardControls');
rewardControls.addEventListener('click', event => {
  const filter = event.target.closest('button[data-filter]');
  if (!filter || filter.dataset.filter === rewardFilter) return;
  rewardFilter = filter.dataset.filter;
  const url = new URL(location.href);
  if (rewardFilter === 'affordable') url.searchParams.set('filter', rewardFilter);
  else url.searchParams.delete('filter');
  history.replaceState(history.state, '', url);
  renderGrid();
});

function getRewardAction(reward, pending) {
  if (pending) return { label: 'ตรวจรายการเดิม', disabled: false };
  if (reward.stock <= 0) return { label: RoyalStatus.get('reward', 'sold_out').label, disabled: true };
  if (!REWARDS_SCORE_READY) return { label: 'รอตรวจคะแนน', disabled: true };
  const shortage = reward.cost - CURRENT_SCORE;
  if (shortage > 0) {
    return { label: `ขาดอีก ${formatRewardPoints.format(shortage)} คะแนน`, disabled: true, shortage: true };
  }
  return { label: 'แลกรางวัล', disabled: false };
}

function renderGrid() {
  const wrap = document.getElementById('rewardGrid');
  const affordableOnly = rewardFilter === 'affordable';
  const wallet = document.getElementById('rewardWalletBalance');
  const balance = REWARDS_SCORE_READY ? formatRewardPoints.format(CURRENT_SCORE) : '—';
  if (wallet.textContent !== balance) wallet.textContent = balance;
  rewardControls.querySelectorAll('button[data-filter]').forEach(button => {
    const selected = button.dataset.filter === rewardFilter;
    button.setAttribute('aria-pressed', String(selected));
    button.classList.toggle('active', selected);
  });

  const uid = getUid();
  const pendingIds = new Set(REWARD_LIST.filter(reward => window.RoyalSpend.pending(uid, reward.id)).map(reward => reward.id));
  document.getElementById('rewardPendingLink').classList.toggle('d-none', !affordableOnly || pendingIds.size === 0);
  const list = affordableOnly
    ? REWARD_LIST.filter(reward => REWARDS_SCORE_READY && reward.stock > 0 && reward.cost <= CURRENT_SCORE && !pendingIds.has(reward.id))
    : REWARD_LIST;

  const preview = document.getElementById('rewardPreviewModal');
  if (preview.classList.contains('show')) {
    const reward = REWARD_LIST.find(item => String(item.id) === preview.dataset.rewardId);
    if (reward) updateRewardPreview(reward);
  }

  if (list.length === 0) {
    const message = !affordableOnly ? 'ยังไม่มีของรางวัลที่เปิดให้แลก'
      : REWARDS_SCORE_READY ? 'ตอนนี้ยังไม่มีของรางวัลที่แลกได้ด้วยคะแนนของคุณ'
      : 'รายการที่แลกได้จะแสดงเมื่อตรวจคะแนนสำเร็จ';
    wrap.innerHTML = `<p class="text-center text-muted py-4 m-0" style="grid-column: 1 / -1" role="status">${message}</p>`;
    return;
  }
  
  wrap.innerHTML = list.map(r => {
    const isSoldOut = r.stock <= 0;
    const pending = pendingIds.has(r.id);
    const action = getRewardAction(r, pending);

    const id = escapeHtml(r.id);
    const name = escapeHtml(r.name || 'ของรางวัล');
    const img = escapeHtml(safeImageUrl(r.img));
    const cost = Number(r.cost || 0);
    const stock = Number(r.stock || 0);
    const stockMax = Number(r.stock_max || 0);

    return `
    <div class="reward-card${isSoldOut && !pending ? ' soldout' : ''}" data-reward-id="${id}">
      <img src="${img}" alt="${name}" loading="lazy" data-reward-image>
      <div class="reward-meta">
        <span class="reward-cost">${formatRewardPoints.format(cost)} คะแนน</span>
        ${isSoldOut ? RoyalStatus.badge('reward', 'sold_out') : `<span class="reward-stock">เหลือ ${stockMax > 0 ? `${stock}/${stockMax}` : stock} ชิ้น</span>`}
      </div>

      <div class="reward-name">${name}</div>
      ${!isSoldOut || pending ? `<div class="reward-footer">
        <button
          type="button"
          class="btn btn-sm btn-success w-100 rounded-pill fw-bold${action.shortage ? ' reward-shortage' : ''}"
          ${action.disabled ? 'disabled' : ''}>
          ${action.label}
        </button>
      </div>` : ''}
    </div>
  `}).join('');
  bindRewardImageFallbacks(wrap);
}

document.getElementById('rewardGrid')?.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  const card = event.target.closest('.reward-card');
  const rewardId = card?.dataset.rewardId;
  const reward = REWARD_LIST.find(item => String(item.id) === String(rewardId));
  if (!reward) return;

  if (button) {
    if (button.disabled) return;
    redeemReward(reward.id, reward.name, Number(reward.cost || 0), reward.img, button);
    return;
  }

  const modal = updateRewardPreview(reward);
  bootstrap.Modal.getOrCreateInstance(modal).show();
});

function updateRewardPreview(reward) {
  const modalEl = document.getElementById('rewardPreviewModal');
  modalEl.dataset.rewardId = String(reward.id);

  const cost = Number(reward.cost || 0);
  const stock = Number(reward.stock || 0);
  const stockMax = Number(reward.stock_max || 0);
  const isSoldOut = stock <= 0;
  const action = getRewardAction(reward, window.RoyalSpend.pending(getUid(), reward.id));

  document.getElementById('rewardPreviewImg').src = reward.img || 'https://placehold.co/300x300?text=No+Image';
  document.getElementById('rewardPreviewName').textContent = reward.name || 'ของรางวัล';
  document.getElementById('rewardPreviewCost').textContent = `${formatRewardPoints.format(cost)} คะแนน`;
  document.getElementById('rewardPreviewStock').textContent = isSoldOut ? RoyalStatus.get('reward', 'sold_out').label : (stockMax > 0 ? `เหลือ ${stock}/${stockMax} ชิ้น` : `เหลือ ${stock} ชิ้น`);

  const redeemBtn = document.getElementById('rewardPreviewRedeemBtn');
  if (redeemBtn) {
    redeemBtn.disabled = action.disabled;
    redeemBtn.textContent = action.label;
    redeemBtn.onclick = async () => {
      if (redeemBtn.disabled) return;
      bootstrap.Modal.getInstance(modalEl)?.hide();
      const cardButton = document.querySelector(`.reward-card[data-reward-id="${CSS.escape(reward.id)}"] button`);
      await redeemReward(reward.id, reward.name, cost, reward.img, cardButton || redeemBtn);
    };
  }

  return modalEl;
}

/* ===============================
   REDEEM FUNCTION (Updated)
================================ */
async function redeemReward(rewardId, rewardName, cost, rewardImg, button) {
  if (REDEEMING) return;

  const uid = getUid();
  if (!uid) {
    Swal.fire('แจ้งเตือน', 'กรุณากลับไปหน้าหลักเพื่อเข้าสู่ระบบใหม่', 'warning');
    return;
  }

  // 1. เช็คคะแนนฝั่ง Client ก่อนส่ง
  const pending = window.RoyalSpend.pending(uid, rewardId);
  if (!pending && !REWARDS_SCORE_READY) return;
  if (!pending && CURRENT_SCORE < cost) {
    Swal.fire('คะแนนไม่พอ', `คุณมี ${CURRENT_SCORE} คะแนน แต่รางวัลนี้ใช้ ${cost} คะแนน`, 'error');
    return;
  }

  // 2. Popup ยืนยันสวยๆ (เหมือนหน้าหลัก)
  const confirm = await Swal.fire({
    title: pending ? 'ส่งคำขอแลกรางวัลเดิมอีกครั้ง?' : 'ยืนยันการแลก?',
    html: `ต้องการแลก <b>${escapeHtml(rewardName)}</b><br>ใช้ <b>${formatRewardPoints.format(cost)}</b> คะแนน`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: pending ? 'ส่งคำขอเดิม' : 'แลกเลย',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#198754'
  });

  if (!confirm.isConfirmed || REDEEMING) return;

  REDEEMING = true;
  const previousText = button?.textContent;
  if (button) {
    button.disabled = true;
    button.textContent = 'กำลังแลก...';
  }

  try {
    const redeemRequestId = window.RoyalSpend.start(uid, rewardId);
    // 3. เรียก API
    const spendResult = await Loading.apiFetch('/api/spend', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ uid, rewardId, cost, requestId: redeemRequestId })
    }, { scope: 'overlay', msg: 'กำลังบันทึกข้อมูล...' });
    if (spendResult?.status !== 'success') throw spendResult || new Error('spend_failed');
    window.RoyalSpend.finish(uid, rewardId);
    if (spendResult.duplicate) {
      const status = spendResult.redemption?.status === 'cancelled_refunded' ? 'รายการเดิมถูกยกเลิกและคืนคะแนนแล้ว' : 'พบรายการแลกเดิมในประวัติ';
      const result = await Swal.fire({
        title: status, text: `เลขรายการ ${spendResult.redemption.id}`, icon: 'info',
        showCancelButton: true, confirmButtonText: 'ดูหลักฐาน', cancelButtonText: 'ปิด'
      });
      if (result.isConfirmed) return openPickupEvidence(spendResult.redemption.id);
      await loadAllRewards();
      return;
    }

    // 4. ตัดคะแนนในตัวแปร และ LocalStorage ทันที
    CURRENT_SCORE = Number.isFinite(Number(spendResult?.balance)) ? Number(spendResult.balance) : Math.max(0, CURRENT_SCORE - cost);
    try { localStorage.setItem(`RP_SCORE:${uid}`, CURRENT_SCORE); } catch {}
    
    // 5. อัปเดต UI (ตัดสต็อก + ล็อกปุ่มรางวัลอื่นถ้าคะแนนไม่พอแล้ว)
    const reward = REWARD_LIST.find(item => String(item.id) === String(rewardId));
    if (reward) {
      reward.stock = Math.max(0, reward.stock - 1);
      REWARD_LIST.sort((a, b) => Number(a.stock <= 0) - Number(b.stock <= 0) || a.sort_index - b.sort_index);
    }
    renderGrid();

    // 6. Popup สำเร็จ (มีรูป)
    const result = await Swal.fire({
        title: "แลกสำเร็จ! 🎉",
        imageUrl: rewardImg || undefined,
        imageWidth: 150,
        imageHeight: 'auto',
        imageAlt: String(rewardName || 'ของรางวัล'),
        html: `
          <h5 class="fw-bold text-dark mt-2">${escapeHtml(rewardName)}</h5>
          <div class="mb-3">${RoyalStatus.badge('redemption', 'approved')}</div>
          <div class="mb-3 text-muted">ใช้ ${formatRewardPoints.format(cost)} คะแนน</div>
          <div class="alert alert-success small p-2 text-start">
             สามารถเข้ารับของได้ที่ส่วนงาน SHE โดยแสดงหลักฐานรายการแลกแก่ จป.วิชาชีพ<br>
             หากต้องการตรวจสอบว่า จป. อยู่ที่โต๊ะหรือไม่ กรุณาโทรผ่านโทรศัพท์ภายในบริษัทที่ <span class="fw-bold">1199 หรือ 1919</span>
          </div>
          ${spendResult?.redemption?.id ? `<div class="small text-muted text-break">เลขรายการ: ${escapeHtml(spendResult.redemption.id)}</div>` : ''}
        `,
        confirmButtonText: 'ดูหลักฐานรับของ',
        showCancelButton: true,
        cancelButtonText: 'ปิด',
        confirmButtonColor: "#22c55e"
    });
    if (result.isConfirmed && spendResult.redemption?.id) return openPickupEvidence(spendResult.redemption.id);

    try { await loadAllRewards(); } catch {}

  } catch (err) {
    console.error(err);
    window.RoyalSpend.finish(uid, rewardId, err?.message || 'spend_failed');
    if (rewardFilter === 'affordable' && window.RoyalSpend.pending(uid, rewardId)) renderGrid();
    Swal.fire('ผิดพลาด', RoyalStatus.spendError(err), 'error');
  } finally {
    REDEEMING = false;
    if (button && document.body.contains(button)) {
      button.disabled = false;
      button.textContent = window.RoyalSpend.pending(uid, rewardId) ? 'ตรวจรายการเดิม' : (previousText || 'แลกรางวัล');
    }
  }
}

function openPickupEvidence(redemptionId) {
  window.location.href = `/?redemption_id=${encodeURIComponent(redemptionId)}`;
}

function goBack(e) {
  e.preventDefault();
  sessionStorage.setItem('FORCE_REFRESH', '1'); 
  window.location.href = '/'; // หรือ index.html
}

// เริ่มทำงาน
document.getElementById('retryRewardsLoad').addEventListener('click', loadAllRewards);
loadAllRewards();

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
